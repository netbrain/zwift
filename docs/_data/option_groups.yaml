---
# Groups for the variable filter on configuration/options.md. A variable that is not listed only shows under "All".
Updates:
- IMAGE
- VERSION
- SCRIPT_VERSION
- DEFERRED_UPDATE
- DONT_UPDATE
- DONT_CLEAN
Account:
- ZWIFT_RIDER
- ZWIFT_USERNAME
- ZWIFT_PASSWORD
Paths:
- ZWIFT_WORKOUT_DIR
- ZWIFT_ACTIVITY_DIR
- ZWIFT_LOG_DIR
- ZWIFT_SCREENSHOTS_DIR
Graphics:
- ZWIFT_OVERRIDE_GRAPHICS
- ZWIFT_OVERRIDE_RESOLUTION
- WINE_EXPERIMENTAL_WAYLAND
- WINE_DISABLE_EGL
- VGA_DEVICE_FLAG
Container:
- CONTAINER_TOOL
- CONTAINER_EXTRA_ARGS
- NETWORKING
- PRIVILEGED_CONTAINER
- DISABLE_BLUETOOTH
- ZWIFT_FG
- ZWIFT_NO_GAMEMODE
Debugging:
- DEBUG
- VERBOSITY
- DRYRUN
- INTERACTIVE
